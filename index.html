<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#21090f">
<title>Crimson Custom Cakes | Photo Booth</title>
<style>
:root{--wine:#310d18;--wine2:#5a1729;--gold:#e7c78a;--cream:#fff7ed}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#5b1a2d 0,#21090f 55%,#10070a 100%);color:var(--cream);font-family:Georgia,serif;min-height:100vh}
main{width:min(100% - 28px,520px);margin:0 auto;padding:25px 0 34px;text-align:center}
.brand{width:145px;height:105px;object-fit:contain;border-radius:10px;background:#080608;padding:4px;display:block;margin:0 auto 12px}
h1{font-size:clamp(25px,7vw,34px);margin:5px 0;color:#fff1df;letter-spacing:.4px}
.tag{color:var(--gold);font-style:italic;margin:0 0 20px;font-size:15px}
.panel{background:rgba(12,5,8,.66);border:1px solid rgba(231,199,138,.42);border-radius:20px;padding:16px;box-shadow:0 14px 40px #0006}
.preview-wrap{position:relative;background:#090709;border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.placeholder{color:#d9c5c5;padding:20px;line-height:1.5}
#countdown{position:absolute;inset:0;display:none;place-items:center;background:#0005;color:white;font: bold 88px Arial;text-shadow:0 3px 12px #000}
label{display:block;text-align:left;color:var(--gold);font-size:14px;margin:16px 0 7px}
select,button{font:inherit;border-radius:999px}
select{width:100%;padding:12px;background:#1d0b11;color:white;border:1px solid #a97856}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
button{border:1px solid var(--gold);padding:12px 10px;background:transparent;color:var(--cream);cursor:pointer;font-size:14px}
button.primary{background:linear-gradient(135deg,#d9b778,#f0dba9);color:#281017;border:0;font-weight:bold}
button:disabled{opacity:.45;cursor:not-allowed}
#result{display:none;margin-top:18px}
#photo{width:100%;border-radius:12px;border:1px solid var(--gold);display:block;background:#090709}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.note{font:12px/1.5 Arial,sans-serif;color:#cdbfc0;margin:15px 4px 0}
.status{min-height:20px;font:13px Arial,sans-serif;color:var(--gold);margin-top:10px}
@media(max-width:360px){.controls button,.result-actions button{font-size:12px;padding:11px 6px}}
</style>
</head>
<body>
<main>
  <img class="brand" src="crimson-logo.jpg" alt="Crimson Custom Cakes logo">
  <h1>Crimson Custom Cakes</h1>
  <p class="tag">A little moment. A lasting memory.</p>
  <section class="panel">
    <div class="preview-wrap">
      <video id="video" autoplay playsinline muted style="display:none"></video>
      <div class="placeholder" id="placeholder">Your photo booth is ready.<br>Tap <b>Start Camera</b> to begin.</div>
      <div id="countdown"></div>
    </div>
    <label for="theme">Choose your photo frame</label>
    <select id="theme">
      <option value="Birthday">Birthday Celebration</option>
      <option value="Wedding">Wedding Moments</option>
      <option value="Anniversary">Anniversary Love</option>
    </select>
    <div class="controls">
      <button class="primary" id="start">Start Camera</button>
      <button id="switch" disabled>Switch Camera</button>
      <button class="primary" id="capture" disabled>3-2-1 Capture</button>
      <button id="stop" disabled>Stop Camera</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div id="result">
      <canvas id="photo"></canvas>
      <div class="result-actions">
        <button class="primary" id="download">Download Photo</button>
        <button id="share">Share Photo</button>
        <button id="retake" style="grid-column:1/-1">Retake Photo</button>
      </div>
    </div>
  </section>
  <p class="note">Your camera is used only to take the picture. Photos are created on this device and are not uploaded to Crimson Custom Cakes.</p>
</main>
<script>
const video=document.getElementById('video'), placeholder=document.getElementById('placeholder');
const startBtn=document.getElementById('start'), switchBtn=document.getElementById('switch');
const captureBtn=document.getElementById('capture'), stopBtn=document.getElementById('stop');
const countdown=document.getElementById('countdown'), statusEl=document.getElementById('status');
const result=document.getElementById('result'), canvas=document.getElementById('photo');
let stream=null, facing='user', lastBlob=null;
function setStatus(t){statusEl.textContent=t}
async function startCamera(){
 try{
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});
  video.srcObject=stream; video.style.display='block'; placeholder.style.display='none';
  await video.play(); startBtn.disabled=true;switchBtn.disabled=false;captureBtn.disabled=false;stopBtn.disabled=false;
  setStatus('Camera is on. Choose a frame and capture!');
 }catch(e){setStatus('Camera access was blocked. Allow camera permission and try again.');}
}
function stopCamera(){
 if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;
 video.srcObject=null;video.style.display='none';placeholder.style.display='block';
 startBtn.disabled=false;switchBtn.disabled=true;captureBtn.disabled=true;stopBtn.disabled=true;
 setStatus('Camera stopped.');
}
startBtn.addEventListener('click',startCamera);
switchBtn.addEventListener('click',async()=>{facing=facing==='user'?'environment':'user';await startCamera()});
stopBtn.addEventListener('click',stopCamera);
function roundedRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.stroke()}
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
async function takePhoto(){
 if(!stream)return;
 captureBtn.disabled=true;countdown.style.display='grid';
 for(let n=3;n>0;n--){countdown.textContent=n;await new Promise(r=>setTimeout(r,750))}
 countdown.textContent='♥';await new Promise(r=>setTimeout(r,250));countdown.style.display='none';
 const w=1080,h=1350,ctx=canvas.getContext('2d');canvas.width=w;canvas.height=h;
 ctx.fillStyle='#21090f';ctx.fillRect(0,0,w,h);
 const vw=video.videoWidth,vh=video.videoHeight,ratio=Math.max(w/(h-210),vw/vh);
 const cw=vw, ch=vh, targetRatio=w/(h-210);let sx=0,sy=0,sw=cw,sh=ch;
 if(cw/ch>targetRatio){sw=ch*targetRatio;sx=(cw-sw)/2}else{sh=cw/targetRatio;sy=(ch-sh)/2}
 if(facing==='user'){ctx.translate(w,0);ctx.scale(-1,1)}
 ctx.drawImage(video,sx,sy,sw,sh,0,0,w,h-210);
 if(facing==='user'){ctx.setTransform(1,0,0,1,0,0)}
 const theme=document.getElementById('theme').value;
 ctx.fillStyle='#21090f';ctx.fillRect(0,h-210,w,210);
 ctx.strokeStyle='#e7c78a';ctx.lineWidth=9;roundedRect(ctx,22,22,w-44,h-44,28);
 ctx.strokeStyle='rgba(231,199,138,.75)';ctx.lineWidth=3;ctx.strokeRect(42,h-190,w-84,170);
 ctx.fillStyle='#f5dfb5';ctx.textAlign='center';ctx.font='italic 54px Georgia';ctx.fillText(theme+' Memories',w/2,h-118);
 ctx.font='32px Georgia';ctx.fillText('A little moment. A lasting memory.',w/2,h-72);
 const logo=await loadImage('crimson-logo.jpg');
 const maxW=245,maxH=100,scale=Math.min(maxW/logo.width,maxH/logo.height);
 const lw=logo.width*scale,lh=logo.height*scale;
 ctx.drawImage(logo,(w-lw)/2,h-62-lh,lw,lh);
 result.style.display='block';canvas.scrollIntoView({behavior:'smooth',block:'nearest'});
 canvas.toBlob(b=>{lastBlob=b},'image/png');captureBtn.disabled=false;
 setStatus('Your Crimson memory is ready!');
}
captureBtn.addEventListener('click',takePhoto);
document.getElementById('retake').addEventListener('click',()=>{result.style.display='none';setStatus('Ready for another photo!')});
document.getElementById('download').addEventListener('click',()=>{
 canvas.toBlob(blob=>{const a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download='Crimson-Custom-Cakes-photo.png';a.click();URL.revokeObjectURL(u)},'image/png');
});
document.getElementById('share').addEventListener('click',async()=>{
 canvas.toBlob(async blob=>{
  const file=new File([blob],'Crimson-Custom-Cakes-photo.png',{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Crimson Custom Cakes',text:'A little moment. A lasting memory.'})}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setStatus('Sharing is not supported here, so the photo was downloaded.')}
  }catch(e){if(e.name!=='AbortError')setStatus('Could not open sharing on this device. Please download the photo.')}
 },'image/png');
});
</script>
</body>
</html>
